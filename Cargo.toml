[package]
name = "url-shortener-v1"
version = "0.5.0"
authors = ["Jeffery D. Mitchell", "<crusty.rustacean@gmail.com>"]
edition = "2024"
description = "An API which provides a URL shortening service."
readme = "README.md"
repository = "https://github.com/sentinel1909/url-shortener-v1.git"
license = "MIT"
publish = false

[[bin]]
name = "url-shortener-v1"
path = "src/bin/main.rs"

[lib]
name = "url_shortener_v1_lib"
path = "src/lib/lib.rs"

[dependencies]
anyhow = "1.0.99"
axum = "0.8.4"
axum-extra = { version = "0.10.1", features = [ "typed-header" ] }
axum-macros = "0.5.0"
chrono = { version = "0.4.42", features = ["serde"] }
nanoid = "0.4.0"
regex = "1.11.2"
serde = { version = "1.0.219", features = ["derive"] }
shuttle-axum = "0.57.0"
shuttle-runtime = { version = "0.57.0", default-features = false }
shuttle-shared-db = { version = "0.57.0", features = ["postgres", "sqlx"] }
sqlx = { version = "0.8.5", features = [ "runtime-tokio", "tls-rustls" ] }
thiserror = "2.0.16"
tokio = "1.44.2"
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["request-id", "trace", "util"] }
tracing = { version = "0.1.41", features = ["log"] }
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.20", features = ["registry", "env-filter"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12.12", features = [ "json" ] }
shuttle-common = "0.57.0"
testcontainers-modules = { version = "0.13.0", features = [ "postgres" ] }
toml = "0.9.5"
uuid = "1.11.1"
